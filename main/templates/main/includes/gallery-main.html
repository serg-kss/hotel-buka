{% load static %}
{% load i18n %}
{% get_current_language as CURRENT_LANG %}

{% if photo %}
<section id="gallery-showcase" class="gallery-showcase section">

      <div class="container" data-aos="fade-up" data-aos-delay="100">

        <div class="gallery-carousel swiper init-swiper" data-aos="fade-up" data-aos-delay="200">
          <script type="application/json" class="swiper-config">
            {
              "loop": true,
              "speed": 600,
              "autoplay": {
                "delay": 3000
              },
              "slidesPerView": 1,
              "spaceBetween": 20,
              "centeredSlides": true,
              "breakpoints": {
                "576": {
                  "slidesPerView": 2,
                  "centeredSlides": false
                },
                "768": {
                  "slidesPerView": 3,
                  "centeredSlides": false
                },
                "992": {
                  "slidesPerView": 4,
                  "centeredSlides": false
                },
                "1200": {
                  "slidesPerView": 5,
                  "centeredSlides": false
                }
              }
            }
          </script>
         <div class="swiper-wrapper">
          {% for item in photo %}
          {% if item.img %}
          <div class="swiper-slide">
            <div class="gallery-item">
              <img src="{{ item.img.url }}"
               alt="{% if CURRENT_LANG == 'uk' %}{{ item.alt_uk }}{% else %}{{ item.alt_en }}{% endif %}"
               class="img-fluid"
               loading="lazy">
              <a href="{{ item.img.url }}" class="gallery-overlay glightbox">
                <i class="bi bi-eye"></i>
              </a>
            </div>
          </div>
          {% endif %}
          {% endfor %}
         </div>
        </div>

        <div class="text-center mt-5" data-aos="fade-up" data-aos-delay="300">
          <a href="{% url "main:gallery" %}" class="btn btn-gallery">
            <i class="bi bi-collection me-2"></i>{% trans "Discover Our Full Gallery" %}
          </a>
        </div>

      </div>

</section>
{% else %}
<section id="gallery-showcase" class="gallery-showcase section"></section>
{% endif %}
